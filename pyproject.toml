
[project]
name = "finalproject-lukyanchikov-dpo"
version = "0.1.0"
description = "ValutaTrade Hub - платформа для отслеживания курсов валют и симуляции торговли"
readme = "README.md"
authors = [
    { name = "Лукьянчиков" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
finalproject-lukyanchikov-dpo = "valutatrade_hub:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"

[tool.valutatrade]
rates_ttl_seconds = 300
default_base_currency = "USD"
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
logs_dir = "logs"
log_format = "%(asctime)s | %(levelname)s | %(message)s"
